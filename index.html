<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسالة خاصة ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    /* الظرف */
    .envelope {
      position: relative;
      width: 280px;
      height: 180px;
      margin: auto;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    .back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #e75480;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 100px solid #f4779d;
      transform-origin: top;
      transition: transform 0.8s;
      z-index: 3;
    }

    .letter {
      position: absolute;
      width: 90%;
      height: 130px;
      left: 5%;
      top: 20px;
      background: white;
      border-radius: 8px;
      transition: transform 0.8s;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e75480;
      font-size: 22px;
      font-weight: bold;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope.open .letter {
      transform: translateY(-90px);
    }

    .hint {
      margin-top: 25px;
      color: #a33b5d;
      font-size: 18px;
    }

    /* السؤال */
    .question {
      display: none;
      background: rgba(255,255,255,0.95);
      padding: 35px 25px;
      border-radius: 25px;
      width: min(90vw, 500px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.15);
    }

    .question h1 {
      color: #d6336c;
      font-size: 32px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 60px;
    }

    button {
      border: none;
      padding: 14px 35px;
      border-radius: 30px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #e75480;
      color: white;
    }

    #yes:hover {
      background: #d6336c;
      transform: scale(1.1);
    }

    #no {
      background: #ddd;
      color: #555;
      position: relative;
    }

    /* الاحتفال */
    .celebration {
      display: none;
      text-align: center;
      animation: pop 0.8s ease;
    }

    .celebration h1 {
      color: #d6336c;
      font-size: 42px;
      margin: 10px;
    }

    .kiss {
      font-size: 100px;
      animation: kiss 1s infinite alternate;
    }

    .celebration p {
      font-size: 25px;
      color: #8f3151;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    @keyframes kiss {
      from { transform: scale(1) rotate(-5deg); }
      to { transform: scale(1.15) rotate(5deg); }
    }

    /* القلوب */
    .heart {
      position: fixed;
      font-size: 25px;
      animation: fall linear forwards;
      top: -40px;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @media (max-width: 500px) {
      .question h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- الظرف -->
    <div id="envelopeBox">
      <div class="envelope" id="envelope">
        <div class="back"></div>
        <div class="letter">رسالة ليك ❤️</div>
        <div class="flap"></div>
      </div>

      <div class="hint">اضغط على الظرف 💌</div>
    </div>

    <!-- السؤال -->
    <div class="question" id="question">
      <h1>هل تقبل الزواج بي؟ 💍❤️</h1>

      <div class="buttons">
        <button id="yes">نعم ❤️</button>
        <button id="no">لا 😏</button>
      </div>
    </div>

    <!-- الاحتفال -->
    <div class="celebration" id="celebration">
      <div class="kiss">💋</div>
      <h1>يــــاااااااه! ❤️🎉</h1>
      <p>مبروك علينا يا حبيبي! 💍🥰</p>
      <p>تمت الموافقة بنجاح 😂❤️</p>
    </div>

  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const envelopeBox = document.getElementById("envelopeBox");
    const question = document.getElementById("question");
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const celebration = document.getElementById("celebration");

    // فتح الظرف
    envelope.addEventListener("click", () => {
      envelope.classList.add("open");

      setTimeout(() => {
        envelopeBox.style.display = "none";
        question.style.display = "block";
      }, 1000);
    });

    // زر "لا" يهرب 😏
    function moveNoButton() {
      const maxX = window.innerWidth - no.offsetWidth - 20;
      const maxY = window.innerHeight - no.offsetHeight - 20;

      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(10, Math.random() * maxY);

      no.style.position = "fixed";
      no.style.left = x + "px";
      no.style.top = y + "px";
    }

    no.addEventListener("mouseenter", moveNoButton);
    no.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // نعم ❤️
    yes.addEventListener("click", () => {
      question.style.display = "none";
      celebration.style.display = "block";
      celebrationHearts();
    });

    // الاحتفال بالقلوب والقبلات
    function celebrationHearts() {
      const symbols = ["❤️", "💖", "💕", "💋", "💍", "🥰", "🎉"];

      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.className = "heart";
          heart.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];

          heart.style.left = Math.random() * 100 + "vw";
          heart.style.animationDuration =
            (2 + Math.random() * 4) + "s";
          heart.style.fontSize =
            (18 + Math.random() * 30) + "px";

          document.body.appendChild(heart);

          setTimeout(() => heart.remove(), 6000);
        }, i * 50);
      }
    }
  </script>

</body>
</html>
